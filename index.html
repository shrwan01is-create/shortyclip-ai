<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShortyClip AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>ShortyClip AI</h1>
    <p class="subtitle">Turn long videos into viral clips</p>

    <h2>YouTube Link</h2>
    <input id="youtubeUrl" type="text" placeholder="Paste YouTube link" />
    <button id="getClipsBtn">Get Clips</button>
    <div id="youtubeResult"></div>

    <hr class="divider" />

    <h2>Upload Video</h2>
    <input id="videoFile" type="file" accept="video/*" />
    <button id="uploadBtn">Upload Video</button>
    <div id="uploadResult"></div>

    <hr class="divider" />

    <button id="testBackendBtn">Test Backend</button>
    <div id="backendResult"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <script src="script.js"></script>
</body>
</html>
